# ─────────────────────────────────────────────
# Portfolio config
# Read by scripts/update.js at build time.
# ─────────────────────────────────────────────

github: asong56   # GitHub username

# Notes folder: GitHub API URL to a folder in any repo.
# update.js lists files, finds the most recently committed one,
# and bakes it into generated.json as "thought".
# Format: https://api.github.com/repos/{owner}/{repo}/contents/{path}
notes_api: https://api.github.com/repos/asong56/notes/contents/thoughts

# Now section — things an API can't know, edited by hand
now:
  listening:
    value: Brian Eno — Music for Airports
    sub: on repeat lately
  reading:
    value: Structure and Interpretation of Computer Programs
    sub: Abelson & Sussman
  building:
    value: this site
    sub: vanilla html/css/js, no frameworks
  thinking:
    value: how much can be done with less
    sub: ""

# Music — artists whose catalog is searched via iTunes API at build time.
# update.js fetches one track per artist into generated.json.
music:
  artists:
    - Brian Eno
    - Aphex Twin
    - Four Tet
    - Floating Points
    - Jon Hopkins
    - Boards of Canada

# Footer links (GitHub is added automatically from the API)
links:
  - label: Twitter
    href: "https://twitter.com/"
  - label: Email
    href: "mailto:hi@example.com"
  - label: RSS
    href: "/feed.xml"

# ─────────────────────────────────────────────
# 404 / Lab page
# ─────────────────────────────────────────────
not_found:
  intro_lines:
    - "looking for that page..."
    - "— not here."
    - "here's something else instead."
  type_speed: 55        # ms per character
  line_pause: 400        # ms pause between lines
  dissolve_duration: 1400 # ms for the particle dissolve
